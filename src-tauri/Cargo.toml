[package]
name = "dum-e"
version = "0.1.0-alpha.1"
description = "Your little database helper"
license = "MIT"
repository = "https://github.com/duckfollow/dum-e"
edition = "2021"
[lib]
name = "dum_e_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[[bin]]
name = "Dum-E"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
semver = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "sqlite", "chrono", "uuid", "bigdecimal", "json"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
bigdecimal = "0.4"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSProcessInfo"] }

[dependencies.sqlparser]
version = "0.59"
default-features = false
features = ["std"]
